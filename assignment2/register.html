<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create an account to save your dining preferences and manage your reservations effortlessly.">
    <title>Register | Klang Valley Dining</title>
    <!-- One external stylesheet shared by every page -->
    <link rel="stylesheet" href="css/style.css">
    <!-- One script file shared by every page; "defer" runs it after the HTML is parsed -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- ===== Shared header + navigation ===== -->
    <header class="site-header">
        <div class="header-inner">
            <div class="site-name">Klang Valley Dining</div>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="restaurants.html">Restaurants</a></li>
                    <li><a href="recommend.html">Recommendations</a></li>
                    <li><a href="register.html" class="active">Register</a></li>
                    <li><a href="reservation.html">Reserve</a></li>
                    <li><a href="bill.html">Bill Calculator</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ===== Page content ===== -->
    <main>
        <h1>Create an Account</h1>

        <section id="register-section">
            <h2>Registration Details</h2>

            <!-- Form uses novalidate so we can handle all errors via JavaScript -->
            <form id="register-form" action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php" method="POST">
    <div class="form-group">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" name="username" placeholder="At least 5 chars (letters, numbers, _)">
        <span id="reg-username-error" class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="text" id="reg-email" name="email" placeholder="e.g., user@example.com">
        <span id="reg-email-error" class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="reg-phone">Phone Number</label>
        <input type="text" id="reg-phone" name="phone" placeholder="8 to 15 digits">
        <span id="reg-phone-error" class="error-message"></span>
    </div>

    <fieldset class="form-group">
        <legend>Gender</legend>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
        <label><input type="radio" name="gender" value="prefer_not"> Prefer not to say</label>
        <!-- Error span for gender -->
        <span id="reg-gender-error" class="error-message" style="display:block; margin-top:5px;"></span>
    </fieldset>

    <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" name="password" placeholder="Min 10 chars, uppercase, lowercase, number, special">
        <span id="reg-password-error" class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input type="password" id="reg-confirm" name="confirm">
        <span id="reg-confirm-error" class="error-message"></span>
    </div>

    <button type="submit">Register Account</button>
</form>
        </section>
    </main>

    <!-- ===== Shared footer ===== -->
    <footer class="site-footer">
        <p>&copy; 2026 Klang Valley Dining. COS10005 Assignment 2 by Wong Jia Lun (105728022).</p>
    </footer>

</body>
</html>
