<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Secure your table at one of our top-rated restaurants with our easy online reservation form.">
    <title>Reservation | Klang Valley Dining</title>
    <!-- One external stylesheet shared by every page -->
    <link rel="stylesheet" href="css/style.css">
    <!-- One script file shared by every page; "defer" runs it after the HTML is parsed -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- ===== Shared header + navigation ===== -->
    <header class="site-header">
        <div class="header-inner">
            <div class="site-name">Klang Valley Dining</div>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="restaurants.html">Restaurants</a></li>
                    <li><a href="recommend.html">Recommendations</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><a href="reservation.html" class="active">Reserve</a></li>
                    <li><a href="bill.html">Bill Calculator</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ===== Page content ===== -->
    <main>
        <h1>Reserve a Table</h1>

        <section id="reservation-section">
            <h2>Reservation Details</h2>

  <form id="reservation-form" action="http://mercury.swin.edu.au/it000000/cos10005/regtest.php" method="POST">
    <!-- Required fields -->
    <div class="form-group">
        <label for="res-name">Full Name</label>
        <input type="text" id="res-name" name="name">
        <span id="res-name-error" class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="res-email">Email Address</label>
        <input type="text" id="res-email" name="email">
        <span id="res-email-error" class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="res-phone">Phone Number (Min 10 digits)</label>
        <input type="text" id="res-phone" name="phone">
        <span id="res-phone-error" class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="res-date">Reservation Date</label>
        <input type="date" id="res-date" name="date">
        <span id="res-date-error" class="error-message"></span>
    </div>

    <!-- Time Selection -->
    <div class="form-group">
        <label for="res-time">Reservation Time</label>
        <input type="time" id="res-time" name="time">
        <span id="res-time-error" class="error-message"></span>
    </div>

    <!-- Special Requests -->
    <div class="form-group">
        <label for="res-requests">Special Requests (Optional)</label>
        <textarea id="res-requests" name="requests" rows="3" placeholder="Allergies, high chair, etc."></textarea>
    </div>

    <div class="form-group">
        <label for="res-people">Number of People</label>
        <input type="number" id="res-people" name="people" min="1" value="1">
        <span id="res-people-error" class="error-message"></span>
    </div>

    <!-- Payment Selection -->
    <fieldset class="form-group">
        <legend>Payment Method</legend>
        <label><input type="radio" name="payment" value="voucher"> Voucher</label>
        <label><input type="radio" name="payment" value="online"> Online Payment (Credit Card)</label>
        <span id="res-payment-error" class="error-message" style="display:block;"></span>
    </fieldset>

    <!-- Voucher Section (Hidden by default) -->
    <div id="section-voucher" style="display: none;" class="form-group">
        <label for="res-voucher">12-Digit Voucher Code</label>
        <input type="text" id="res-voucher" name="voucher" placeholder="Enter 12-digit code">
    </div>

    <!-- Credit Card Section (Hidden by default) -->
    <div id="section-cc" style="display: none;" class="form-group">
        <label for="res-cc-type">Card Type</label>
        <select id="res-cc-type" name="cc-type">
            <option value="visa-mc">Visa / Mastercard</option>
            <option value="amex">American Express</option>
        </select>

        <label for="res-cc-number" style="margin-top: 10px;">Credit Card Number</label>
        <input type="text" id="res-cc-number" name="cc-number" placeholder="Digits only">
        <span id="res-cc-error" class="error-message"></span>
    </div>

    <!-- Billing Email with Checkbox -->
    <div class="form-group">
        <label for="res-billing-email" style="margin-top: 20px;">Billing Email Address</label>
        <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 5px; display: block;">
            <input type="checkbox" id="same-email-check"> Same as email address
        </label>
        <input type="text" id="res-billing-email" name="billing-email">
        <span id="res-billing-email-error" class="error-message"></span>
    </div>

    <button type="submit">Confirm Reservation</button>
</form>
        </section>
    </main>

    <!-- ===== Shared footer ===== -->
    <footer class="site-footer">
        <!-- Remember to update the TODOs with your Name and Student ID -->

    </footer>

</body>
</html>
